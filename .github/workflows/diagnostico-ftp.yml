name: Diagnóstico FTP (somente leitura)

# Lista as pastas que o login FTP dos secrets enxerga. Não envia nem apaga nada.
# Rodar na mão: Actions > Diagnóstico FTP > Run workflow. Apagar este arquivo depois de usar.

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Listar raiz e public_html (nomes apenas)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Porta: ${FTP_PORT}"
          echo "Host termina em: ...${FTP_SERVER: -6}"
          echo "Usuário começa com: ${FTP_USERNAME:0:5}..."
          for DIR in "" "public_html/" "public_html/app/" "domains/"; do
            echo
            echo "===== /${DIR} ====="
            curl --silent --show-error --max-time 40 --list-only \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              "ftp://${FTP_SERVER}:${FTP_PORT}/${DIR}" || echo "(não foi possível listar /${DIR})"
          done
