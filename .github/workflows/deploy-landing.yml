name: Deploy Landing to Hostinger (clinica-aurea.com)

on:
  push:
    branches: ["main"]
    paths:
      - "landing/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm run build

      # Sem clean-slate: a pasta do subdomínio do app pode ficar dentro de public_html.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '21' }}
          local-dir: ./landing/dist/
          server-dir: ${{ secrets.HOSTINGER_LANDING_PATH }}
          state-name: .ftp-deploy-sync-state-landing.json
