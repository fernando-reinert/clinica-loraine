name: Deploy Landing (clinica-aurea.com)

# Publica o site (Astro) na raiz de public_html via FTP.
# O login FTP cai em /public_html (pasta de entrada, NÃO é a do site). O site fica em
# /domains/clinica-aurea.com/public_html/, por isso o server-dir é um caminho ABSOLUTO.
# Credenciais FTP: secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_PORT.
# Sem "clean-slate": a pasta app/ (sistema) fica dentro de public_html e não pode ser apagada.
# O arquivo de estado próprio garante que só são removidos arquivos que a landing enviou antes.

on:
  push:
    branches: ["main"]
    paths:
      - "landing/**"
  workflow_dispatch: # Execução manual (aba Actions > Run workflow)

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Verificar build
        run: |
          test -f dist/index.html
          test -d dist/_astro

      - name: Deploy via FTP (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./landing/dist/
          server-dir: /domains/clinica-aurea.com/public_html/
          state-name: .ftp-deploy-sync-state-landing.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
