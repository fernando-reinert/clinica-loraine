name: Deploy App (app.clinica-aurea.com)

# Publica o sistema em public_html/app via FTP.
# O login FTP entra na pasta pessoal da conta; o site fica em domains/clinica-aurea.com/public_html/.
# Credenciais FTP: secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_PORT.
# Chaves do Supabase no build: secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY.
# Sem "clean-slate": o action só remove o que ele mesmo enviou antes (arquivo de estado).

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "landing/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: # Execução manual (aba Actions > Run workflow)

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sem estas variáveis o build sai apontando para um Supabase falso (app quebrado).
      - name: Verificar variáveis do Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Crie os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verificar build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          ls dist/assets/index-*.js

      - name: Deploy via FTP (public_html/app)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: ./domains/clinica-aurea.com/public_html/app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
